# Utilityoptamizer Errors

## Action

Throw `RuleViolation(issues[])` for business rules and `Forbidden`/`NotFound`/`Conflict` otherwise; don't catch and rethrow generic errors.

## Evidence

- HttpErrorFilter mapping described in CLAUDE.md

