# Utilityoptamizer Imports

## Action

In apps/web use the `@/` alias; in apps/api use relative imports; import domain code from `@uo/shared`. Never `import type` a constructor-injected class in the API.

## Evidence

- 200+ `from "@/` imports in apps/web/src; CLAUDE.md (NestJS DI needs value imports)

