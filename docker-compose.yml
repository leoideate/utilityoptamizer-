# Local development services. Start with: docker compose up -d
# Ports bind to 127.0.0.1 only. Postgres uses host port 5433 to avoid clashing with other local databases. Credentials here are for local development only.
name: utility-optimizer-crm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uo
      POSTGRES_PASSWORD: uo_local_dev
      POSTGRES_DB: uo_crm
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uo -d uo_crm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for development (SeaweedFS). Production uses AWS S3 or any S3 provider.
  # The API creates the private bucket on start-up in development.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=5"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Catches outgoing email in development. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
  redisdata:
  s3data:
