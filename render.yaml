# Render Blueprint for the Utility Optimizer CRM. See docs/deploy-render.md before using it.
# Everything runs in Render's EU region (Frankfurt). Only the web app is public; the API is a
# private service reached through the web app's /api proxy.

databases:
  - name: uo-crm-db
    databaseName: uo_crm
    user: uo
    region: frankfurt
    plan: basic-1gb
    postgresMajorVersion: "16"
    # No outside connections; services use the private network.
    ipAllowList: []

envVarGroups:
  # Shared by the API and the worker. Secrets marked sync: false are entered in the dashboard.
  - name: uo-crm-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # Requests reach the API through Render's proxy and the web app on the private network.
      - key: TRUST_PROXY
        value: loopback,linklocal,uniquelocal
      - key: RUN_WORKERS_IN_API
        value: "false"
      # Generated once by Render. Copy both into your password manager straight away: without
      # FIELD_ENCRYPTION_KEY the encrypted fields (bank details, dates of birth…) can't be read.
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: APP_SECRET
        generateValue: true
      # Public address of the web app, e.g. https://crm.utilityoptimizer.com
      - key: WEB_ORIGIN
        sync: false
      # File storage: an S3 bucket (AWS eu-west-1 recommended) or another S3-compatible service.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Outgoing email (e.g. submission packs), e.g. smtps://user:pass@email-smtp.eu-west-1.amazonaws.com:465
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false

services:
  - name: uo-crm-redis
    type: keyvalue
    region: frankfurt
    plan: starter
    # The job queue must never lose jobs to eviction.
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - name: uo-crm-api
    type: pserv
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Runs before each new version starts; migrations are forward-only.
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - fromGroup: uo-crm-shared
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: uo-crm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: uo-crm-redis
          type: keyvalue
          property: connectionString

  - name: uo-crm-worker
    type: worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    envVars:
      - fromGroup: uo-crm-shared
      - key: DATABASE_URL
        fromDatabase:
          name: uo-crm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: uo-crm-redis
          type: keyvalue
          property: connectionString

  - name: uo-crm-web
    type: web
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: "3000"
      # Build argument: the API's private host:port. The /api proxy target is fixed at build time.
      - key: API_HOSTPORT
        fromService:
          name: uo-crm-api
          type: pserv
          property: hostport
      # Build argument: your bucket's origin, allowed by the Content-Security-Policy for document
      # previews, e.g. https://uo-documents.s3.eu-west-1.amazonaws.com
      - key: STORAGE_ORIGIN
        sync: false
